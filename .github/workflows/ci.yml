name: Backend and Manager

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Create ephemeral database credential
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$password" >> "$GITHUB_ENV"
          echo "DATABASE_TEST_URL=postgres://futryva:$password@127.0.0.1:5432/futryva_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Start isolated PostgreSQL and development inbox
        shell: bash
        run: |
          docker run -d --name futryva-ci-db \
            -e POSTGRES_USER=futryva -e POSTGRES_DB=futryva_test -e POSTGRES_PASSWORD \
            -p 127.0.0.1:5432:5432 \
            --health-cmd='pg_isready -U futryva -d futryva_test' \
            --health-interval=2s --health-retries=30 postgres:16-alpine
          docker run -d --name futryva-ci-mailpit \
            -p 127.0.0.1:1025:1025 -p 127.0.0.1:18025:8025 axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' futryva-ci-db)" = healthy ] \
                && curl --fail --silent http://127.0.0.1:18025/api/v1/messages > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs futryva-ci-db
          docker logs futryva-ci-mailpit
          exit 1
      - name: Check, test and build backend
        run: |
          test -z "$(gofmt -l .)"
          go mod download
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -v ./...
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/futryva" .
      - name: Smoke foundation, identity and clubs with PostgreSQL and SMTP
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: futryva_test
          PGUSER: futryva
          PGSSLMODE: disable
          HOST: 127.0.0.1
          PORT: '8080'
          MIGRATIONS_DIR: ../database
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          COOKIE_SECURE: 'false'
        shell: bash
        run: |
          "$RUNNER_TEMP/futryva" > "$RUNNER_TEMP/futryva-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              python3 ../scripts/smoke.py http://127.0.0.1:8080
              python3 ../scripts/smoke_sprint1.py \
                --base-url http://127.0.0.1:8080 --mailpit-url http://127.0.0.1:18025
              exit $?
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/futryva-api.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/futryva-api.log"
          exit 1

  manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/manager/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test Manager components and client flows
        run: npm test
      - name: Type check and build Manager
        run: npm run build
